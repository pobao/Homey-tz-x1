<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 24px;
        text-align: center;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #1a1a1a;
      }

      p {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        max-width: 320px;
        margin-bottom: 16px;
      }

      .steps {
        list-style: none;
        text-align: left;
        margin: 8px 0 32px;
        max-width: 300px;
        width: 100%;
      }

      .steps li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        font-size: 14px;
        color: #333;
        line-height: 1.5;
        margin-bottom: 14px;
      }

      .step-num {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #2c3e50;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }

      .btn {
        display: inline-block;
        padding: 13px 40px;
        background: #2c3e50;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        width: 100%;
        max-width: 300px;
      }

      .btn:hover { background: #3d5166; }
      .btn:active { background: #1a252f; }
    </style>
  </head>
  <body>

    <!-- Rotary knob SVG icon -->
    <svg class="icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="38" fill="#2c3e50"/>
      <circle cx="40" cy="40" r="28" fill="#34495e"/>
      <circle cx="40" cy="40" r="14" fill="#ecf0f1"/>
      <circle cx="40" cy="40" r="6"  fill="#2c3e50"/>
      <rect   x="37" y="5" width="6" height="10" rx="3" fill="#e74c3c"/>
    </svg>

    <h1>Connect your TZ-X1</h1>
    <p>Follow these steps to put the Smart Scene Button into pairing mode:</p>

    <ol class="steps">
      <li>
        <span class="step-num">1</span>
        <span>Make sure the TZ-X1 is powered on.</span>
      </li>
      <li>
        <span class="step-num">2</span>
        <span>Press and <strong>hold the center button for 5 seconds</strong> until the LED blinks rapidly.</span>
      </li>
      <li>
        <span class="step-num">3</span>
        <span>Tap <strong>Start searching</strong> below — Homey will detect the device automatically.</span>
      </li>
    </ol>

    <button class="btn" id="nextBtn">Start searching</button>

    <script>
      function onHomeyReady(Homey) {
        Homey.ready();

        document.getElementById('nextBtn').addEventListener('click', function () {
          Homey.nextView();
        });
      }
    </script>
  </body>
</html>
