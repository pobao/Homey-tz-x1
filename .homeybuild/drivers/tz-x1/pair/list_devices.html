<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 24px;
        text-align: center;
      }

      .spinner-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 28px;
      }

      /* Outer spinning ring */
      .spinner {
        width: 80px;
        height: 80px;
        border: 4px solid #e8e8e8;
        border-top-color: #2c3e50;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* Static knob icon in centre */
      .spinner-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 52px;
        height: 52px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      p {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        max-width: 280px;
      }

      .hint {
        margin-top: 32px;
        font-size: 12px;
        color: #999;
        max-width: 260px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>

    <div class="spinner-wrap">
      <div class="spinner"></div>
      <svg class="spinner-icon" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="26" r="24" fill="#2c3e50"/>
        <circle cx="26" cy="26" r="18" fill="#34495e"/>
        <circle cx="26" cy="26" r="9"  fill="#ecf0f1"/>
        <circle cx="26" cy="26" r="4"  fill="#2c3e50"/>
        <rect   x="24" y="3" width="4" height="7" rx="2" fill="#e74c3c"/>
      </svg>
    </div>

    <h1>Searching…</h1>
    <p>Homey is looking for your TZ-X1. Make sure the LED is blinking rapidly.</p>

    <p class="hint">If nothing happens after 30 seconds, press and hold the center button again for 5 seconds to re-enter pairing mode.</p>

    <script>
      function onHomeyReady(Homey) {
        Homey.ready();
      }
    </script>
  </body>
</html>
