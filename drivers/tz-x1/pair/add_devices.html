<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 24px;
        text-align: center;
      }

      .icon-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }

      .icon-wrap svg.knob {
        width: 80px;
        height: 80px;
      }

      /* Green checkmark badge */
      .badge {
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 26px;
        height: 26px;
        background: #27ae60;
        border-radius: 50%;
        border: 3px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge svg {
        width: 12px;
        height: 12px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #1a1a1a;
      }

      p {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        max-width: 280px;
        margin-bottom: 8px;
      }

      .device-name {
        display: inline-block;
        margin: 16px 0 28px;
        padding: 8px 20px;
        background: #f4f4f4;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #2c3e50;
      }

      .btn {
        display: inline-block;
        padding: 13px 40px;
        background: #27ae60;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        width: 100%;
        max-width: 300px;
      }

      .btn:hover  { background: #2ecc71; }
      .btn:active { background: #1e8449; }
    </style>
  </head>
  <body>

    <div class="icon-wrap">
      <svg class="knob" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="40" r="38" fill="#2c3e50"/>
        <circle cx="40" cy="40" r="28" fill="#34495e"/>
        <circle cx="40" cy="40" r="14" fill="#ecf0f1"/>
        <circle cx="40" cy="40" r="6"  fill="#2c3e50"/>
        <rect   x="37" y="5" width="6" height="10" rx="3" fill="#e74c3c"/>
      </svg>

      <!-- Green checkmark badge -->
      <div class="badge">
        <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
          <polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <h1>Device found!</h1>
    <p>Your TZ-X1 Smart Scene Button was discovered successfully.</p>

    <div class="device-name" id="deviceName">TZ-X1 Smart Scene Button</div>

    <p>Tap <strong>Add device</strong> to finish setup.</p>

    <script>
      function onHomeyReady(Homey) {
        Homey.ready();
      }
    </script>
  </body>
</html>
